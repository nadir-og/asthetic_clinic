    <!-- Preload Critical Luxury Webfonts (Zero FOUT / Instant First Paint) -->
    <link rel="preload" href="/fonts/cormorant-garamond-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Critical CSS for Instantaneous First Contentful Paint (FCP) -->
    <style>
      /* Cormorant Garamond Font Faces (font-display: block eliminates all fallback flash) */
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/cormorant-garamond-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: italic;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/cormorant-garamond-latin-400-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('/fonts/cormorant-garamond-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: italic;
        font-weight: 600;
        font-display: block;
        src: url('/fonts/cormorant-garamond-latin-600-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('/fonts/cormorant-garamond-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: italic;
        font-weight: 700;
        font-display: block;
        src: url('/fonts/cormorant-garamond-latin-700-italic.woff2') format('woff2');
      }

      /* Inter Font Faces */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/inter-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url('/fonts/inter-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('/fonts/inter-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('/fonts/inter-latin-700-normal.woff2') format('woff2');
      }

      :root {
        --champagne: #e8c98a;
        --champagne-light: #f5e6c8;
        --gold: #e6c168;
        --emerald-deep: #064e3b;
        --emerald-mid: #047857;
        --emerald-light: #10b981;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        background-color: #FDFCFB;
        scroll-behavior: smooth;
        overflow-x: hidden;
        max-width: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #FDFCFB;
        color: #18181b;
        overflow-x: hidden;
        max-width: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .font-serif {
        font-family: 'Cormorant Garamond', Georgia, serif;
      }
      #root {
        min-height: 100vh;
        background-color: #FDFCFB;
      }
    </style>
